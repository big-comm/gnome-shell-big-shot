<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Invert Colors icon: Water drop half-filled with diagonal line -->
  <!-- Drop outline -->
  <path d="M8,1 C8,1 3,6.5 3,9.5 C3,12.5 5.2,15 8,15 C10.8,15 13,12.5 13,9.5 C13,6.5 8,1 8,1 Z" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Right half filled (invert effect) -->
  <clipPath id="halfClip">
    <rect x="8" y="0" width="8" height="16"/>
  </clipPath>
  <path d="M8,1 C8,1 3,6.5 3,9.5 C3,12.5 5.2,15 8,15 C10.8,15 13,12.5 13,9.5 C13,6.5 8,1 8,1 Z" fill="#ffffff" clip-path="url(#halfClip)"/>
  <!-- Diagonal line across -->
  <line x1="2" y1="2.5" x2="14" y2="14.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
</svg>
